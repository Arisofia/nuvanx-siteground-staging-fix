name: Gemini AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-code-review:
    name: Gemini Review
    # Run on PR open/sync, or when someone comments "/gemini-review" on a PR
    if: >
      github.event_name == 'pull_request' || 
      (github.event.issue.pull_request && contains(github.event.comment.body, '/gemini-review'))
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Report Gemini review availability
        run: |
          if [[ -n "${GEMINI_API_KEY}" ]]; then
            echo "Gemini review is enabled."
          else
            echo "Gemini review skipped: GEMINI_API_KEY is not configured."
          fi
      - name: Gemini AI Code Reviewer
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: truongnh1992/gemini-ai-code-reviewer@7c4b01afa073e48a44c72cdc1d010f9e3b95686f # v9.2.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          # Opcional: Modelos soportados (gemini-2.5-pro, gemini-2.5-flash, etc.)
          # GEMINI_MODEL: gemini-2.5-pro 
          EXCLUDE: "*.md,*.txt,package-lock.json,composer.lock,*.yml,*.yaml"
